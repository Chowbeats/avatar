<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas.drag { cursor: grabbing; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);

  // ---------- helpers ----------
  function srgb(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }
  function canvasTex(w, h, draw) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    var t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 8;
    return t;
  }
  function std(color, o) {
    var p = { color: srgb(color), roughness: 0.5, metalness: 0 };
    if (o) for (var k in o) p[k] = o[k];
    return new THREE.MeshStandardMaterial(p);
  }
  function ball(r, material, sx, sy, sz) {
    var m = new THREE.Mesh(new THREE.SphereGeometry(r, 40, 28), material);
    m.scale.set(sx || 1, sy || 1, sz || 1);
    return m;
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  // ---------- palette (two creatures, slightly different) ----------
  var PAL = [
    { skin: 0x5b3fc4, belly: 0xcdb8ff, horn: 0xf2a03a, wing: 0xe5533d, cheek: 0xff8fb0, iris: '#f0a22a' },
    { skin: 0xc43f5b, belly: 0xffc4cf, horn: 0xffd166, wing: 0x7a2a8a, cheek: 0xff9fb8, iris: '#5ad1a0' }
  ];
  var irisTexCache = {};
  function irisTex(color) {
    if (irisTexCache[color]) return irisTexCache[color];
    return irisTexCache[color] = canvasTex(128, 128, function (g, w, h) {
      var rg = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      rg.addColorStop(0, '#000'); rg.addColorStop(0.28, '#000');
      rg.addColorStop(0.33, '#3a2a0a'); rg.addColorStop(0.55, color);
      rg.addColorStop(0.9, '#4a3010'); rg.addColorStop(1, '#1a1005');
      g.fillStyle = rg; g.fillRect(0, 0, w, h);
    });
  }

  // ---------- lights ----------
  scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x8b6fd0, 0.7));
  var key = new THREE.DirectionalLight(0xfff1e0, 1.25);
  key.position.set(4, 10, 7);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -12; key.shadow.camera.right = 12;
  key.shadow.camera.top = 12; key.shadow.camera.bottom = -12;
  key.shadow.camera.near = 1; key.shadow.camera.far = 40;
  key.shadow.radius = 4;
  key.shadow.bias = -0.0005;
  scene.add(key);
  var fill = new THREE.DirectionalLight(0x9db8ff, 0.45);
  fill.position.set(-6, 3, 4);
  scene.add(fill);
  var rim = new THREE.DirectionalLight(0xff9a6b, 0.9);
  rim.position.set(-3, 5, -7);
  scene.add(rim);

  var ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.2 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // ---------- creature factory ----------
  // side = -1: creature on the left, holds the flag with its right hand (toward center)
  // side = +1: creature on the right, holds with its left hand
  function makeCreature(side, pal) {
    var C = {};
    var skinMat = new THREE.MeshPhysicalMaterial({
      color: srgb(pal.skin), roughness: 0.48, metalness: 0,
      clearcoat: 0.3, clearcoatRoughness: 0.45,
      emissive: srgb(pal.skin).multiplyScalar(0.25), emissiveIntensity: 0.6
    });
    var bellyMat = new THREE.MeshPhysicalMaterial({
      color: srgb(pal.belly), roughness: 0.55, clearcoat: 0.2,
      emissive: srgb(pal.belly).multiplyScalar(0.2), emissiveIntensity: 0.4
    });
    var hornMat = std(pal.horn, { roughness: 0.32 });

    var fly = new THREE.Group();      // position in formation
    var tilt = new THREE.Group();     // bank / lean
    var rig = new THREE.Group();      // character, origin at feet
    tilt.position.y = 1.5; rig.position.y = -1.5;
    fly.add(tilt); tilt.add(rig);
    C.fly = fly; C.tilt = tilt; C.rig = rig;

    var body = ball(1, skinMat, 1.0, 1.05, 0.9);
    body.position.y = 1.0; rig.add(body); C.body = body;
    var belly = ball(1, bellyMat, 0.62, 0.7, 0.3);
    belly.position.set(0, 0.95, 0.78); rig.add(belly);

    C.feet = [];
    [-1, 1].forEach(function (s) {
      var piv = new THREE.Group();
      piv.position.set(s * 0.5, 0.62, 0.3);
      var f = ball(0.38, skinMat, 1.1, 0.55, 1.3);
      f.position.set(0, -0.42, 0.05); piv.add(f);
      [-1, 0, 1].forEach(function (t) {
        var toe = ball(0.09, hornMat, 1, 1, 1.2);
        toe.position.set(t * 0.2, -0.48, 0.55); piv.add(toe);
      });
      rig.add(piv); C.feet.push(piv);
    });

    // head
    var head = new THREE.Group();
    head.position.set(0, 2.45, 0.05);
    head.scale.setScalar(1.12);
    rig.add(head); C.head = head;
    head.add(ball(1.05, skinMat, 1.12, 1.0, 1.0));

    function makeHorn(hs) {
      var g = new THREE.Group();
      var curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0, 0), new THREE.Vector3(hs * 0.10, 0.38, 0),
        new THREE.Vector3(hs * 0.30, 0.72, 0), new THREE.Vector3(hs * 0.62, 0.98, 0)
      ]);
      var N = 11, pts = curve.getPoints(N), up = new THREE.Vector3(0, 1, 0);
      for (var i = 0; i < N; i++) {
        var a = pts[i], b = pts[i + 1], dir = b.clone().sub(a), len = dir.length();
        var r0 = 0.2 * (1 - i / N) * (1 + (i % 2 ? 0.14 : -0.04));
        var r1 = 0.2 * (1 - (i + 1) / N) * (1 + ((i + 1) % 2 ? 0.14 : -0.04));
        var seg = new THREE.Mesh(new THREE.CylinderGeometry(Math.max(r1, 0.012), r0, len * 1.04, 16), hornMat);
        seg.position.copy(a.clone().add(b).multiplyScalar(0.5));
        seg.quaternion.setFromUnitVectors(up, dir.normalize());
        g.add(seg);
      }
      g.position.set(hs * 0.55, 0.82, 0.05);
      return g;
    }
    head.add(makeHorn(-1)); head.add(makeHorn(1));

    [-1, 1].forEach(function (s) {
      var e = ball(0.26, skinMat, 0.5, 1.0, 0.8);
      e.position.set(s * 1.18, 0.1, -0.05); e.rotation.z = -s * 0.3; head.add(e);
      var inner = ball(0.17, std(pal.cheek, { roughness: 0.7 }), 0.35, 0.8, 0.5);
      inner.position.set(s * 1.24, 0.1, 0.0); inner.rotation.z = -s * 0.3; head.add(inner);
    });

    var antenna = new THREE.Group();
    antenna.position.set(0, 1.0, 0); head.add(antenna); C.antenna = antenna;
    var stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.05, 0.6, 12), std(0x3a2a6a));
    stalk.position.y = 0.3; antenna.add(stalk);
    var bulb = new THREE.Mesh(new THREE.SphereGeometry(0.14, 24, 18),
      std(0xffe27a, { emissive: srgb(0xffc233), emissiveIntensity: 1.0, roughness: 0.3 }));
    bulb.position.y = 0.66; antenna.add(bulb); C.bulb = bulb;
    var bulbLight = new THREE.PointLight(0xffd36a, 0.9, 4); bulb.add(bulbLight); C.bulbLight = bulbLight;

    C.eyes = [];
    var it = irisTex(pal.iris);
    [-1, 1].forEach(function (s) {
      var grp = new THREE.Group();
      grp.position.set(s * 0.5, 0.1, 0.82); grp.scale.setScalar(1.25);
      grp.add(ball(0.3, std(0xfaf6f0, { roughness: 0.18 }), 1, 1.1, 0.55));
      var iris = new THREE.Mesh(new THREE.CircleGeometry(0.19, 32), std(0xffffff, { map: it, roughness: 0.25 }));
      iris.position.z = 0.172; grp.add(iris);
      var sh = new THREE.Mesh(new THREE.CircleGeometry(0.045, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      sh.position.set(0.07, 0.09, 0.004); iris.add(sh);
      var sh2 = new THREE.Mesh(new THREE.CircleGeometry(0.02, 10), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      sh2.position.set(-0.06, -0.07, 0.004); iris.add(sh2);
      var lidPivot = new THREE.Group();
      var lid = new THREE.Mesh(new THREE.SphereGeometry(0.325, 28, 12, 0, Math.PI * 2, 0, Math.PI * 0.42), skinMat);
      lid.scale.set(1, 1.12, 0.62); lidPivot.add(lid); lidPivot.rotation.z = s * 0.08; grp.add(lidPivot);
      head.add(grp);
      C.eyes.push({ iris: iris, lid: lidPivot });
    });

    [-1, 1].forEach(function (s) {
      var c = ball(0.17, std(pal.cheek, { roughness: 0.8 }), 1.2, 0.7, 0.3);
      c.position.set(s * 0.8, -0.25, 0.72); c.rotation.y = s * 0.6; head.add(c);
      var n = ball(0.03, std(0x3a2a6a), 1, 1, 1);
      n.position.set(s * 0.07, -0.02, 1.03); head.add(n);
    });
    var mouth = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.05, 12, 32, Math.PI), std(0x2a1848));
    mouth.rotation.z = Math.PI; mouth.position.set(0, -0.2, 0.97); head.add(mouth);
    var fang = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.1, 12), std(0xffffff, { roughness: 0.3 }));
    fang.rotation.x = Math.PI; fang.position.set(-side * 0.14, -0.34, 0.985); head.add(fang);

    function makeArm(s) {
      var pivot = new THREE.Group();
      pivot.position.set(s * 1.0, 1.55, 0.15);
      var upper = ball(0.28, skinMat, 1, 2.0, 1); upper.position.y = -0.45; pivot.add(upper);
      var hand = ball(0.25, skinMat, 1, 1, 1); hand.position.y = -0.95; pivot.add(hand);
      rig.add(pivot);
      return pivot;
    }
    // "in" arm points toward the flag (center), "out" arm is free
    C.armIn = makeArm(-side);
    C.armOut = makeArm(side);
    C.armInSign = -side;

    // handle held in the inner hand (flag attaches to its top and bottom)
    var holder = new THREE.Group();
    holder.position.set(0, -0.95, 0);
    C.armIn.add(holder); C.holder = holder;
    var goldMat = std(0xffd166, { roughness: 0.3, metalness: 0.6 });
    var handle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3.2, 12), goldMat);
    handle.position.y = 0.9; holder.add(handle);
    var top = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), goldMat); top.position.y = 2.55; holder.add(top);
    var bot = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), goldMat); bot.position.y = -0.75; holder.add(bot);
    C.attachTop = new THREE.Object3D(); C.attachTop.position.y = 2.5; holder.add(C.attachTop);
    C.attachBot = new THREE.Object3D(); C.attachBot.position.y = -0.7; holder.add(C.attachBot);

    // wings
    var WT = [[1.7, 1.1], [1.55, 0.2], [1.0, -0.45], [0.35, -0.7]];
    var ws = new THREE.Shape();
    ws.moveTo(0, 0); ws.quadraticCurveTo(0.6, 1.05, 1.7, 1.1); ws.quadraticCurveTo(1.35, 0.75, 1.55, 0.2);
    ws.quadraticCurveTo(1.15, 0.15, 1.0, -0.45); ws.quadraticCurveTo(0.7, -0.2, 0.35, -0.7); ws.quadraticCurveTo(0.2, -0.3, 0, 0);
    var wingGeo = new THREE.ShapeGeometry(ws, 14);
    (function () {
      var pos = wingGeo.attributes.position, col = [], c1 = srgb(pal.wing).multiplyScalar(0.45), c2 = srgb(pal.wing);
      for (var i = 0; i < pos.count; i++) {
        var d = Math.min(1, Math.hypot(pos.getX(i), pos.getY(i)) / 1.7), c = c1.clone().lerp(c2, d);
        col.push(c.r, c.g, c.b);
      }
      wingGeo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    })();
    var boneMat = std(0x3a1838, { roughness: 0.6 });
    function makeWing(s) {
      var pivot = new THREE.Group();
      pivot.position.set(s * 0.55, 1.65, -0.8);
      var flip = new THREE.Group(); flip.scale.x = s;
      flip.add(new THREE.Mesh(wingGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.6, side: THREE.DoubleSide })));
      WT.forEach(function (t) {
        var a = new THREE.Vector3(0, 0, 0.005), b = new THREE.Vector3(t[0], t[1], 0.005), len = a.distanceTo(b);
        var bone = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.03, len, 8), boneMat);
        bone.position.copy(a.clone().add(b).multiplyScalar(0.5));
        bone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
        flip.add(bone);
      });
      pivot.add(flip); rig.add(pivot);
      return pivot;
    }
    C.wingL = makeWing(-1); C.wingR = makeWing(1);

    // tail
    C.tail = [];
    var tailRoot = new THREE.Group(); tailRoot.position.set(0, 0.6, -0.85); rig.add(tailRoot);
    var prev = tailRoot;
    for (var i = 0; i < 6; i++) {
      var seg = new THREE.Group();
      seg.position.set(0, 0, i === 0 ? 0 : -0.28);
      seg.add(ball(0.2 - i * 0.022, i === 5 ? hornMat : skinMat, 1, 1, 1));
      prev.add(seg); C.tail.push(seg); prev = seg;
    }
    var tip = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.34, 4), hornMat);
    tip.rotation.x = -Math.PI / 2; tip.position.z = -0.3; C.tail[5].add(tip);

    rig.traverse(function (o) { if (o.isMesh) o.castShadow = true; });

    C.side = side;
    C.phase = side < 0 ? 0 : 1.9;
    C.blink = 0; C.nextBlink = 1.5 + Math.random() * 2;
    C.lookX = 0; C.lookY = 0; C.bank = 0; C.lean = 0; C.outZ = 0.8;
    return C;
  }

  var formation = new THREE.Group();   // whole group drifts + yaws
  scene.add(formation);
  var SEP = 10.4;                        // distance between the two creatures
  var A = makeCreature(-1, PAL[0]);
  var B = makeCreature(1, PAL[1]);
  A.fly.position.x = -SEP / 2;
  B.fly.position.x = SEP / 2;
  formation.add(A.fly); formation.add(B.fly);

  // ---------- the big flag ----------
  var flagTex = canvasTex(2048, 960, function (g, w, h) {
    var gr = g.createLinearGradient(0, 0, w, h);
    gr.addColorStop(0, '#3cbf4f'); gr.addColorStop(1, '#1a6b2b');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(255,255,255,0.05)';
    for (var i = -h; i < w; i += 120) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 60, 0); g.lineTo(i + 60 + h, h); g.lineTo(i + h, h); g.closePath(); g.fill(); }
    g.strokeStyle = '#ffd166'; g.lineWidth = 36; g.strokeRect(18, 18, w - 36, h - 36);
    g.strokeStyle = '#fff3c4'; g.lineWidth = 6; g.strokeRect(62, 62, w - 124, h - 124);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = 'rgba(0,0,0,0.35)'; g.shadowBlur = 18; g.shadowOffsetY = 8;
    g.fillStyle = '#ffffff';
    var fs = 236;
    do { g.font = 'bold ' + fs + 'px Georgia, "Times New Roman", serif'; fs -= 4; } while (g.measureText('WELCOME VISITOR').width > w - 260);
    g.fillText('WELCOME VISITOR', w / 2, h * 0.37);
    g.shadowBlur = 0; g.shadowOffsetY = 0;
    g.fillStyle = '#ffd166'; g.fillRect(w / 2 - 300, h * 0.575, 600, 8);
    g.fillStyle = '#ffffff';
    g.font = 'italic bold 150px Georgia, "Times New Roman", serif';
    g.shadowColor = 'rgba(0,0,0,0.3)'; g.shadowBlur = 12; g.shadowOffsetY = 5;
    g.fillText('to the GabrielC site', w / 2, h * 0.76);
  });
  var flagTexBack = flagTex.clone();
  flagTexBack.needsUpdate = true;
  flagTexBack.wrapS = THREE.RepeatWrapping; flagTexBack.repeat.x = -1; flagTexBack.offset.x = 1;

  var FX = 40, FY = 16;
  var flagGeo = new THREE.PlaneGeometry(1, 1, FX, FY);
  var flagUV = flagGeo.attributes.uv;
  var flagF = new THREE.Mesh(flagGeo, new THREE.MeshStandardMaterial({ map: flagTex, roughness: 0.8, side: THREE.FrontSide }));
  var flagB = new THREE.Mesh(flagGeo, new THREE.MeshStandardMaterial({ map: flagTexBack, roughness: 0.8, side: THREE.BackSide }));
  flagF.castShadow = true;
  flagF.frustumCulled = flagB.frustumCulled = false;
  scene.add(flagF); scene.add(flagB);   // world-space mesh; vertices follow the hands each frame

  var vLT = new THREE.Vector3(), vLB = new THREE.Vector3(), vRT = new THREE.Vector3(), vRB = new THREE.Vector3();
  var tmp = new THREE.Vector3();
  function updateFlag(t, speed) {
    A.attachTop.getWorldPosition(vLT); A.attachBot.getWorldPosition(vLB);
    B.attachTop.getWorldPosition(vRT); B.attachBot.getWorldPosition(vRB);
    var pos = flagGeo.attributes.position;
    var amp = 0.12 + speed * 0.1;
    for (var i = 0; i < pos.count; i++) {
      var u = flagUV.getX(i), v = flagUV.getY(i);   // u: 0 left..1 right, v: 1 top..0 bottom
      tmp.set(0, 0, 0);
      tmp.addScaledVector(vLT, (1 - u) * v).addScaledVector(vRT, u * v)
         .addScaledVector(vLB, (1 - u) * (1 - v)).addScaledVector(vRB, u * (1 - v));
      var edge = Math.sin(u * Math.PI);          // 0 at the hands, 1 in the middle
      var sag = -0.35 * edge * (1.1 - v * 0.4);
      var ripple = Math.sin(t * 4.5 + u * 9) * amp * edge + Math.sin(t * 2.3 - u * 5 + v * 2) * amp * 0.5 * edge;
      pos.setXYZ(i, tmp.x, tmp.y + sag + ripple * 0.15, tmp.z + ripple);
    }
    pos.needsUpdate = true;
    flagGeo.computeVertexNormals();
  }

  // ---------- input ----------
  var pointer = { x: 0, y: 0 }, dragging = false, lastX = 0, moved = 0, velY = 0, spin = 0;
  var cheerT = -1, lastInteract = 0;
  var el = renderer.domElement;
  function setPointer(e) {
    var r = el.getBoundingClientRect();
    pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    pointer.y = ((e.clientY - r.top) / r.height) * 2 - 1;
  }
  el.addEventListener('pointerdown', function (e) {
    dragging = true; lastX = e.clientX; moved = 0; velY = 0;
    el.classList.add('drag');
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    setPointer(e);
  });
  el.addEventListener('pointermove', function (e) {
    setPointer(e); lastInteract = performance.now();
    if (!dragging) return;
    var dx = e.clientX - lastX; lastX = e.clientX;
    moved += Math.abs(dx); velY = dx * 0.006; spin += velY;
  });
  function release() {
    if (!dragging) return;
    dragging = false; el.classList.remove('drag');
    if (moved < 5 && cheerT < 0) cheerT = 0;   // click = both cheer
  }
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  window.addEventListener('mousemove', function (e) { setPointer(e); lastInteract = performance.now(); });

  // ---------- camera fit ----------
  var CX = 0, CY = 2.9, FW = 15.8, FH = 7.4;
  function resize() {
    var w = window.innerWidth || 800, h = window.innerHeight || 450;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    var tn = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    var dist = Math.max(FH / 2 / tn, FW / 2 / (tn * camera.aspect));
    camera.position.set(CX, CY + 0.8, dist);
    camera.lookAt(CX, CY, 0);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- animation ----------
  var clock = new THREE.Clock();
  var yaw = 0;

  function animateCreature(C, t, dt, vx, vy, cheer) {
    var p = C.phase;
    C.fly.position.y = 1.2 + Math.sin(t * 1.6 + p) * 0.22 + Math.sin(t * 0.7 + p) * 0.1;
    C.fly.position.z = Math.sin(t * 0.5 + p) * 0.25;
    var vyLocal = vy + Math.cos(t * 1.6 + p) * 0.35;
    C.bank += (-vx * 0.35 - C.bank) * Math.min(1, dt * 3);
    C.lean += ((0.12 - vyLocal * 0.1) - C.lean) * Math.min(1, dt * 3);
    C.tilt.rotation.set(C.lean, 0, C.bank);
    C.rig.rotation.y = -C.side * 0.22;   // face slightly toward the middle

    var breathe = Math.sin(t * 2.2 + p);
    C.body.scale.set(1.0 + breathe * 0.012, 1.05 + breathe * 0.02, 0.9 + breathe * 0.012);

    // look at pointer; when idle, glance at each other sometimes
    var tx = pointer.x, ty = pointer.y;
    if (performance.now() - lastInteract > 4000) {
      var k = Math.sin(t * 0.45 + p * 0.5);
      tx = k > 0.3 ? -C.side * 0.9 : Math.sin(t * 0.7 + p) * 0.4;
      ty = Math.sin(t * 0.5 + p) * 0.2;
    }
    tx += C.side * 0.3;   // compensate the body yaw
    C.lookX += (tx - C.lookX) * Math.min(1, dt * 5);
    C.lookY += (ty - C.lookY) * Math.min(1, dt * 5);
    C.head.rotation.y = clamp(C.lookX, -1, 1) * 0.5;
    C.head.rotation.x = C.lookY * 0.25 - C.lean * 0.5 - cheer * 0.25;
    C.head.rotation.z = Math.sin(t * 1.3 + p) * 0.04;
    C.eyes.forEach(function (e) { e.iris.position.x = clamp(C.lookX, -1, 1) * 0.07; e.iris.position.y = -C.lookY * 0.05; });

    if (t > C.nextBlink && C.blink === 0) C.blink = 0.0001;
    var closed = 0;
    if (C.blink > 0) {
      C.blink += dt / 0.2;
      closed = C.blink < 0.5 ? C.blink * 2 : (1 - C.blink) * 2;
      if (C.blink >= 1) { C.blink = 0; closed = 0; C.nextBlink = t + 1.8 + Math.random() * 3; }
    }
    C.eyes.forEach(function (e) { e.lid.rotation.x = 0.08 + closed * 1.35; });

    C.antenna.rotation.z = Math.sin(t * 3 + p) * 0.12 - vx * 0.4;
    C.antenna.rotation.x = Math.cos(t * 2.4 + p) * 0.08;
    var glow = 0.75 + Math.sin(t * 4 + p) * 0.25;
    C.bulb.material.emissiveIntensity = glow;
    C.bulbLight.intensity = 0.6 + glow * 0.5;

    // inner arm holds the handle out toward the flag; handle stays upright
    var hold = 1.5 + Math.sin(t * 2.4 + p) * 0.04;
    C.armIn.rotation.z = C.armInSign * hold;
    C.holder.rotation.z = -C.armIn.rotation.z - C.tilt.rotation.z;
    C.holder.rotation.x = -C.tilt.rotation.x;
    // outer arm: idle swing, waves when cheering
    var outTarget = cheer > 0 ? 2.4 + Math.sin(t * 12) * 0.4 : 0.8 + Math.sin(t * 2.6 + p) * 0.16;
    C.outZ += (outTarget - C.outZ) * Math.min(1, dt * 8);
    C.armOut.rotation.z = C.side * C.outZ;

    var flap = Math.sin(t * 17 + p);
    C.wingR.rotation.z = 0.3 + flap * 0.5; C.wingL.rotation.z = -(0.3 + flap * 0.5);
    C.wingR.rotation.y = -0.5 - flap * 0.18; C.wingL.rotation.y = 0.5 + flap * 0.18;
    C.feet.forEach(function (f, i) { f.rotation.x = 0.3 + Math.sin(t * 3 + p + i * 1.6) * 0.16 + cheer * 0.5; });
    C.tail.forEach(function (s, i) {
      s.rotation.y = Math.sin(t * 3.2 + p - i * 0.6) * 0.25;
      s.rotation.x = Math.sin(t * 2.1 + p - i * 0.5) * 0.08 + (i === 0 ? 0.4 : 0.05);
    });
  }

  function frame() {
    var dt = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;

    // formation drift
    var px = Math.sin(t * 0.35) * 0.3;
    var py = Math.sin(t * 0.9) * 0.3;
    var pz = Math.cos(t * 0.35) * 0.6;
    var vx = Math.cos(t * 0.35) * 0.3 * 0.35, vy = Math.cos(t * 0.9) * 0.27;
    var speed = Math.hypot(vx, vy);
    formation.position.set(px, py, pz);

    if (!dragging) {
      spin += velY; velY *= 0.94;
      if (Math.abs(velY) < 0.002) spin += (0 - spin) * Math.min(1, dt * 1.6);
    }
    spin = clamp(spin, -0.6, 0.6);
    yaw += (vx * 0.6 - yaw) * Math.min(1, dt * 3);
    formation.rotation.y = yaw + spin;

    var cheer = 0;
    if (cheerT >= 0) {
      cheerT += dt / 1.6;
      if (cheerT >= 1) cheerT = -1; else cheer = Math.sin(cheerT * Math.PI);
    }
    formation.position.y += cheer * 0.6;

    animateCreature(A, t, dt, vx, vy, cheer);
    animateCreature(B, t, dt, vx, vy, cheer);

    scene.updateMatrixWorld(true);
    updateFlag(t, speed);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
